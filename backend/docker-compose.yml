services:
  db:
    image: postgres:16-alpine
    container_name: pharmaconnect-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: pharmaconnect
      POSTGRES_PASSWORD: pharmaconnect
      POSTGRES_DB: pharmaconnect
    ports:
      - "5432:5432"
    volumes:
      - pharmaconnect-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pharmaconnect"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pharmaconnect-pgdata:
